<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Tra Cứu Truyện - Manga Vault</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            margin: 0;
        }

        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 450px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #ff4757;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #ff4757;
        }

        button {
            padding: 12px 20px;
            background-color: #ff4757;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #ff6b81;
        }

        /* Khung hiển thị kết quả */
        #result-card {
            display: none; /* Mặc định ẩn, khi tìm thấy mới hiện */
            background: #2a2a2a;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            margin-top: 15px;
        }

        #manga-title {
            font-size: 18px;
            font-weight: bold;
            color: #70a1ff;
            margin-bottom: 10px;
        }

        #manga-cover {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            max-height: 400px;
            object-fit: cover;
        }

        #status-msg {
            margin-top: 15px;
            font-size: 14px;
            color: #a4b0be;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔍 Tra Cứu Truyện NHentai</h2>

    <div class="search-box">
        <input type="number" id="manga-id" placeholder="Nhập ID (ví dụ: 346115)...">
        <button onclick="searchManga()">Tìm kiếm</button>
    </div>

    <div id="status-msg"></div>

    <!-- Khung hiển thị kết quả -->
    <div id="result-card">
        <div id="manga-title"></div>
        <div id="manga-pages" style="color: #aaa; font-size: 14px;"></div>
        <img id="manga-cover" src="" alt="Ảnh bìa">
    </div>
</div>

<script>
    async function searchManga() {
        const inputId = document.getElementById("manga-id").value.trim();
        const statusMsg = document.getElementById("status-msg");
        const resultCard = document.getElementById("result-card");
        const titleEl = document.getElementById("manga-title");
        const pagesEl = document.getElementById("manga-pages");
        const coverEl = document.getElementById("manga-cover");

        if (!inputId) {
            statusMsg.innerText = "⚠️ Vui lòng nhập mã số truyện!";
            statusMsg.style.color = "#ffa502";
            return;
        }

        // Hiển thị trạng thái đang tải
        statusMsg.innerText = "⏳ Đang lấy dữ liệu từ Backend...";
        statusMsg.style.color = "#a4b0be";
        resultCard.style.display = "none";

        try {
            // 1. GỌI API BACKEND (Đang chạy ở cổng 8001 của bạn)
            const response = await fetch(`http://127.0.0.1:8001/api/v2/galleries/${inputId}`);

            if (response.status === 404) {
                statusMsg.innerText = `❌ Không tìm thấy truyện với ID: ${inputId}`;
                statusMsg.style.color = "#ff4757";
                return;
            }

            if (!response.ok) {
                throw new Error("Lỗi khi kết nối tới máy chủ Backend");
            }

            // 2. NHẬN DỮ LIỆU JSON TỪ BACKEND
            const data = await response.json();

            // 3. BÓC TÁCH TÊN VÀ ẢNH ĐỂ ĐƯA LÊN MÀN HÌNH
            const prettyTitle = data.title.pretty || data.title.english || `Manga #${inputId}`;
            titleEl.innerText = "📖 " + prettyTitle;
            pagesEl.innerText = `📄 Số trang: ${data.num_pages || "Chưa rõ"}`;

            // Lấy ảnh bìa nếu có
            if (data.cover && data.cover.path) {
                coverEl.src = `https://t3.nhentai.net/${data.cover.path}`;
                coverEl.style.display = "block";
            } else {
                coverEl.style.display = "none";
            }

            // Hiển thị khung kết quả và xóa chữ loading
            statusMsg.innerText = "✅ Đã tìm thấy!";
            statusMsg.style.color = "#2ed573";
            resultCard.style.display = "block";

        } catch (error) {
            statusMsg.innerText = "❌ Lỗi: " + error.message;
            statusMsg.style.color = "#ff4757";
        }
    }

    // Bấm phím Enter trong ô input cũng tự động tìm kiếm
    document.getElementById("manga-id").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            searchManga();
        }
    });
</script>
</body>
</html>
