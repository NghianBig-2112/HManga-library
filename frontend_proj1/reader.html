<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc Truyện — HManga Library</title>
    <link rel="icon" type="image/jpeg" href="assets/rem.jpg">
    <!-- Bootstrap 5.3 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.5">
    <style>
        body { margin: 0; padding: 0; overflow-x: hidden; }
        .reader-toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    <!-- 1. Sticky Reader Toolbar -->
    <header class="reader-toolbar">
        <div class="d-flex align-items-center justify-content-between gap-3">
            <!-- Left: Back Button & Comic Title + Chapter -->
            <div class="d-flex align-items-center gap-2 overflow-hidden flex-grow-1" style="min-width: 0;">
                <a id="btn-back-detail" href="index.html" class="btn btn-secondary btn-sm flex-shrink-0">
                    <i class="bi bi-arrow-left me-1"></i>Quay lại
                </a>
                <div class="overflow-hidden text-truncate">
                    <span id="comic-header-title" class="fw-bold text-light small">Đang tải...</span>
                    <span id="chapter-header-badge" class="text-primary small fw-semibold ms-1"></span>
                </div>
            </div>

            <!-- Center: Mode Switch (Vertical Scroll / Single Page) -->
            <div class="btn-group btn-group-sm flex-shrink-0" role="group">
                <button type="button" id="mode-scroll-btn" class="btn btn-primary">
                    <i class="bi bi-view-stacked me-1"></i>Cuộn dọc
                </button>
                <button type="button" id="mode-page-btn" class="btn btn-outline-secondary">
                    <i class="bi bi-file-earmark me-1"></i>Từng trang
                </button>
            </div>

            <!-- Right: Page Counter & Prev / Next Chapter & Favorite Online -->
            <div class="d-flex align-items-center gap-2 flex-shrink-0">
                <button type="button" id="header-fav-online" class="btn btn-sm btn-outline-danger" style="display:none;" title="Yêu thích trên NHentai">
                    <i class="bi bi-heart"></i> <span id="fav-online-text">Yêu thích</span>
                </button>
                <span id="header-page-counter" class="badge bg-dark-subtle border py-2 px-3 small" style="display:none;">1 / 1</span>
                <button type="button" id="header-prev-chap" class="btn btn-secondary btn-sm" style="display:none;" title="Chương trước">
                    <i class="bi bi-chevron-left me-1"></i>Trước
                </button>
                <button type="button" id="header-next-chap" class="btn btn-primary btn-sm" style="display:none;" title="Chương sau">
                    Sau<i class="bi bi-chevron-right ms-1"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 2. Main Reader Container -->
    <div class="reader-container" id="reader-container">
        
        <!-- Mode 1: Continuous Vertical Scroll -->
        <div id="scroll-view" class="scroll-mode-view">
            <div style="text-align:center; padding:80px 0; color:var(--text-dim);">
                <div class="spinner-border text-primary mb-2" role="status"></div>
                <div>Đang kết nối và tải ảnh...</div>
            </div>
        </div>

        <!-- Mode 2: Single Page View -->
        <div id="page-view" class="page-mode-view" style="display:none;">
            <div class="page-mode-wrapper">
                <!-- Left Click Zone (Previous Page) -->
                <div class="click-zone click-zone-left" id="zone-prev" title="Nhấp hoặc cuộn lên để xem trang trước">
                    <span class="click-hint-icon"><i class="bi bi-chevron-left"></i> Trang trước</span>
                </div>

                <!-- Comic Page Image -->
                <img id="single-page-img" class="page-reading-image" src="" alt="Trang truyện" referrerpolicy="no-referrer" onerror="handleImageFallback(this)" style="display:none;">

                <!-- Right Click Zone (Next Page) -->
                <div class="click-zone click-zone-right" id="zone-next" title="Nhấp hoặc cuộn xuống để xem trang tiếp theo">
                    <span class="click-hint-icon">Trang sau <i class="bi bi-chevron-right"></i></span>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Bar for Vertical Scroll Mode -->
        <div class="chapter-nav-bar" id="scroll-bottom-nav" style="display:none;">
            <button type="button" id="nav-prev-chap" class="btn btn-secondary" style="visibility:hidden;">
                <i class="bi bi-chevron-left me-1"></i>Chương trước
            </button>
            <a id="nav-comic-center" href="index.html" class="btn btn-secondary btn-sm" style="color:var(--text-muted);">
                <i class="bi bi-info-circle me-1"></i>Chi tiết truyện
            </a>
            <button type="button" id="nav-next-chap" class="btn btn-primary" style="visibility:hidden;">
                Chương sau<i class="bi bi-chevron-right ms-1"></i>
            </button>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js?v=3.5"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const chapterId = parseInt(urlParams.get('id'), 10);
        const onlineGalleryId = parseInt(urlParams.get('gallery_id'), 10);
        
        let currentMode = 'scroll'; // 'scroll' hoặc 'page'
        let pageUrls = [];          // Danh sách link ảnh của chương
        let currentPageIndex = 0;   // Chỉ số trang hiện tại
        let comicId = null;         // ID bộ truyện
        let prevChapterId = null;   // ID chương trước
        let nextChapterId = null;   // ID chương sau
        let isWheelThrottled = false;
        let isOnlineFav = false;

        async function initReader() {
            if (!chapterId && !onlineGalleryId) {
                document.getElementById('comic-header-title').textContent = 'Lỗi truy cập';
                document.getElementById('scroll-view').innerHTML = '<div style="text-align:center; padding:60px 0; color:var(--danger);">Mã chapter hoặc ID truyện không hợp lệ!</div>';
                return;
            }

            if (onlineGalleryId) {
                // ================= CHẾ ĐỘ ĐỌC ONLINE TỪ NHENTAI =================
                try {
                    document.getElementById('comic-header-title').textContent = 'Đang tải thông tin online...';
                    const gallery = await api.getNhentaiGalleryPages(onlineGalleryId);

                    pageUrls = gallery.pages || [];
                    document.getElementById('comic-header-title').textContent = gallery.title;
                    document.getElementById('chapter-header-badge').textContent = `• #${onlineGalleryId} (${gallery.num_pages} trang)`;
                    document.getElementById('btn-back-detail').href = 'discover.html';
                    document.getElementById('nav-comic-center').href = 'discover.html';
                    document.getElementById('nav-comic-center').innerHTML = '<i class="bi bi-compass me-1"></i>Khám phá NHentai';

                    // Xử lý nút "❤️ Yêu thích" (NHentai Favorites - tuân thủ quy tắc 4.4)
                    const favBtn = document.getElementById('header-fav-online');
                    const favText = document.getElementById('fav-online-text');
                    if (favBtn) {
                        favBtn.style.display = 'inline-flex';
                        favBtn.onclick = async () => {
                            favBtn.disabled = true;
                            try {
                                if (isOnlineFav) {
                                    await api.removeFavorite(onlineGalleryId);
                                    isOnlineFav = false;
                                    favBtn.className = 'btn btn-sm btn-outline-danger';
                                    favBtn.innerHTML = '<i class="bi bi-heart me-1"></i>Yêu thích';
                                    showToast(`Đã bỏ yêu thích #${onlineGalleryId} trên NHentai!`, 'info');
                                } else {
                                    await api.addFavorite(onlineGalleryId);
                                    isOnlineFav = true;
                                    favBtn.className = 'btn btn-sm btn-danger';
                                    favBtn.innerHTML = '<i class="bi bi-heart-fill me-1"></i>Đã thích';
                                    showToast(`Đã thêm #${onlineGalleryId} vào NHentai Favorites! Vào Thư viện > Favorites để lưu vào thư mục riêng.`, 'success');
                                }
                            } catch (e) {
                                showToast(e.message || 'Lỗi cập nhật Favorites', 'error');
                            } finally {
                                favBtn.disabled = false;
                            }
                        };
                    }

                    renderScrollView();
                    updateSinglePageView();
                    updateModeUI();

                } catch (err) {
                    document.getElementById('comic-header-title').textContent = 'Lỗi kết nối NHentai';
                    document.getElementById('scroll-view').innerHTML = `<div style="text-align:center; padding:60px 0; color:var(--danger);">Không thể tải truyện từ NHentai: ${err.message}</div>`;
                }
                return;
            }

            // ================= CHẾ ĐỘ ĐỌC TRUYỆN TRONG THƯ VIỆN =================
            try {
                pageUrls = await api.getChapterPages(chapterId);

                let foundComic = null;
                let foundChapter = null;
                let paramComicId = parseInt(urlParams.get('comic_id'), 10);

                if (paramComicId) {
                    try {
                        foundComic = await api.getComic(paramComicId);
                        foundChapter = foundComic?.chapters?.find(item => item.id === chapterId);
                    } catch {}
                }

                if (!foundComic) {
                    try {
                        const chInfo = await api.getChapter(chapterId);
                        if (chInfo && chInfo.comic_id) {
                            foundComic = await api.getComic(chInfo.comic_id);
                            foundChapter = chInfo;
                        }
                    } catch {}
                }

                if (foundComic) {
                    comicId = foundComic.id;
                    document.getElementById('comic-header-title').textContent = foundComic.title;
                    document.getElementById('chapter-header-badge').textContent = `• Chương ${foundChapter?.chapter_number || ''}`;
                    document.getElementById('btn-back-detail').href = `detail.html?id=${comicId}`;
                    document.getElementById('nav-comic-center').href = `detail.html?id=${comicId}`;

                    const sortedChaps = [...(foundComic.chapters || [])].sort((a, b) => a.chapter_number - b.chapter_number);
                    const curIndex = sortedChaps.findIndex(ch => ch.id === chapterId);

                    // Setup Previous Chapter
                    if (curIndex > 0) {
                        prevChapterId = sortedChaps[curIndex - 1].id;
                        document.getElementById('header-prev-chap').style.display = 'inline-flex';
                        document.getElementById('header-prev-chap').onclick = () => { window.location.href = `reader.html?id=${prevChapterId}&comic_id=${comicId}`; };
                        
                        const bottomPrev = document.getElementById('nav-prev-chap');
                        bottomPrev.style.visibility = 'visible';
                        bottomPrev.onclick = () => { window.location.href = `reader.html?id=${prevChapterId}&comic_id=${comicId}`; };
                    }

                    // Setup Next Chapter
                    if (curIndex >= 0 && curIndex < sortedChaps.length - 1) {
                        nextChapterId = sortedChaps[curIndex + 1].id;
                        document.getElementById('header-next-chap').style.display = 'inline-flex';
                        document.getElementById('header-next-chap').onclick = () => { window.location.href = `reader.html?id=${nextChapterId}&comic_id=${comicId}`; };
                        
                        const bottomNext = document.getElementById('nav-next-chap');
                        bottomNext.style.visibility = 'visible';
                        bottomNext.onclick = () => { window.location.href = `reader.html?id=${nextChapterId}&comic_id=${comicId}`; };
                    }
                }

                renderScrollView();
                updateSinglePageView();
                updateModeUI();

            } catch (err) {
                document.getElementById('scroll-view').innerHTML = `<div style="text-align:center; padding:60px 0; color:var(--danger);">Lỗi tải ảnh: ${err.message}</div>`;
            }
        }

        function renderScrollView() {
            const scrollView = document.getElementById('scroll-view');
            if (pageUrls.length === 0) {
                scrollView.innerHTML = '<div style="padding:40px; color:var(--text-dim);">Không tìm thấy trang nào.</div>';
                return;
            }
            scrollView.innerHTML = pageUrls.map((url, i) => {
                const src = url.startsWith('http') ? url : `${API_BASE}${url}`;
                return `<div class="reader-page-wrapper" id="page-wrapper-${i}" data-page="${i + 1}">
                    <img src="${src}" 
                         alt="Trang ${i + 1}" 
                         data-page="${i + 1}" 
                         class="reading-image" 
                         loading="lazy" 
                         referrerpolicy="no-referrer"
                         onload="if(this.naturalWidth&&this.naturalHeight){this.style.aspectRatio=this.naturalWidth+' / '+this.naturalHeight;}"
                         onerror="handleImageFallback(this)">
                </div>`;
            }).join('');
        }

        function updateSinglePageView() {
            if (pageUrls.length === 0) return;
            const img = document.getElementById('single-page-img');
            img.dataset.triedExts = '';
            const curUrl = pageUrls[currentPageIndex];
            img.src = curUrl.startsWith('http') ? curUrl : `${API_BASE}${curUrl}`;
            img.alt = `Trang ${currentPageIndex + 1}`;
            img.setAttribute('data-page', currentPageIndex + 1);
            img.style.display = 'block';

            const counter = document.getElementById('header-page-counter');
            counter.textContent = `Trang ${currentPageIndex + 1} / ${pageUrls.length}`;
        }

        function goToNextPage() {
            if (currentPageIndex < pageUrls.length - 1) {
                currentPageIndex++;
                updateSinglePageView();
            } else if (nextChapterId) {
                showConfirmModal({
                    title: 'Hết chương',
                    message: 'Bạn đã đọc đến cuối chương này. Bạn có muốn chuyển sang <strong>Chương tiếp theo</strong> không?',
                    confirmText: 'Chương tiếp theo',
                    cancelText: 'Ở lại',
                    type: 'primary',
                    onConfirm: () => {
                        window.location.href = `reader.html?id=${nextChapterId}${comicId ? '&comic_id=' + comicId : ''}`;
                    }
                });
            }
        }

        function goToPrevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                updateSinglePageView();
            } else if (prevChapterId) {
                showConfirmModal({
                    title: 'Đầu chương',
                    message: 'Bạn đang ở trang đầu tiên của chương này. Bạn có muốn quay lại <strong>Chương trước</strong> không?',
                    confirmText: 'Chương trước',
                    cancelText: 'Ở lại',
                    type: 'primary',
                    onConfirm: () => {
                        window.location.href = `reader.html?id=${prevChapterId}${comicId ? '&comic_id=' + comicId : ''}`;
                    }
                });
            }
        }

        function updateModeUI() {
            const scrollBtn = document.getElementById('mode-scroll-btn');
            const pageBtn = document.getElementById('mode-page-btn');
            const scrollView = document.getElementById('scroll-view');
            const pageView = document.getElementById('page-view');
            const pageCounter = document.getElementById('header-page-counter');
            const scrollNav = document.getElementById('scroll-bottom-nav');

            if (currentMode === 'scroll') {
                scrollBtn.className = 'btn btn-primary';
                pageBtn.className = 'btn btn-outline-secondary';
                scrollView.style.display = 'flex';
                pageView.style.display = 'none';
                pageCounter.style.display = 'none';
                scrollNav.style.display = 'flex';
            } else {
                pageBtn.className = 'btn btn-primary';
                scrollBtn.className = 'btn btn-outline-secondary';
                scrollView.style.display = 'none';
                pageView.style.display = 'flex';
                pageCounter.style.display = 'inline-block';
                scrollNav.style.display = 'none';
                updateSinglePageView();
            }
        }

        document.getElementById('mode-scroll-btn').addEventListener('click', () => {
            currentMode = 'scroll';
            updateModeUI();
        });

        document.getElementById('mode-page-btn').addEventListener('click', () => {
            currentMode = 'page';
            updateModeUI();
        });

        document.getElementById('zone-prev').addEventListener('click', goToPrevPage);
        document.getElementById('zone-next').addEventListener('click', goToNextPage);

        window.addEventListener('wheel', (e) => {
            if (currentMode !== 'page') return;
            if (document.getElementById('global-confirm-modal')?.classList.contains('active')) return;
            e.preventDefault();

            if (isWheelThrottled) return;

            if (e.deltaY > 15 || e.deltaX > 15) {
                goToNextPage();
                isWheelThrottled = true;
                setTimeout(() => { isWheelThrottled = false; }, 160);
            } else if (e.deltaY < -15 || e.deltaX < -15) {
                goToPrevPage();
                isWheelThrottled = true;
                setTimeout(() => { isWheelThrottled = false; }, 160);
            }
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (currentMode !== 'page') return;
            if (document.getElementById('global-confirm-modal')?.classList.contains('active')) return;
            if (e.key === ' ') {
                e.preventDefault();
                goToNextPage();
                return;
            }
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                goToNextPage();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                goToPrevPage();
            }
        });

        initReader();
    </script>
</body>
</html>
