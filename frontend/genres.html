<!--
  HManga Library — Trang Quản Lý Thể Loại (genres.html)
  ======================================================
  Nhiệm vụ:
  1. Hiển thị danh sách toàn bộ các thể loại trong thư viện kèm số lượng bộ truyện của từng thể loại.
  2. Cung cấp form thêm thể loại mới.
  3. Cung cấp chức năng Đổi tên thể loại (modal popup).
  4. Cung cấp chức năng Xóa thể loại (kèm hộp thoại xác nhận).
  5. Khi click vào một thể loại -> Hiển thị danh sách tất cả các bộ truyện thuộc thể loại đó bên dưới.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Genres — HManga Library</title>
    <!-- Favicon website -->
    <link rel="icon" type="image/jpeg" href="assets/rem.jpg">
    <!-- Stylesheet dùng chung -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Danh sách thẻ thể loại */
        .genres-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .genre-card {
            background: #0d131f;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .genre-card:hover {
            border-color: var(--primary);
            background: #131b2e;
            transform: translateY(-2px);
        }
        .genre-card.active {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.15);
        }
        .genre-card-info {
            min-width: 0;
            flex: 1;
        }
        .genre-card-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .genre-card-count {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 2px;
        }
        .genre-card-actions {
            display: flex;
            gap: 4px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <!-- 1. Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="assets/rem.jpg" alt="HManga Logo" class="nav-logo">
                <span class="nav-brand-text">HManga</span>
            </a>
            <!-- Quick Search Form -->
            <div class="nav-center">
                <form class="quick-search-form" id="quickSearchForm" action="index.html" method="GET" autocomplete="off">
                    <div class="quick-search-wrapper">
                        <input type="search" name="s" id="inputQuickSearch" class="quick-search-input" placeholder="Search comics..." autocomplete="off">
                    </div>
                    <a href="search.html" id="btnGoAdvanced" class="btn-go-advanced" title="Advanced Search">
                        <span>Advanced Search</span>
                    </a>
                </form>
            </div>
            <div class="nav-links">
                <a href="genres.html" class="nav-link active">Genres</a>
                <a href="authors.html" class="nav-link">Authors</a>
                <a href="add.html" class="btn-add">
                    <span>Add Comic</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- 2. Main Content Area -->
    <main class="main-content">
        <!-- Page Title -->
        <div class="page-header">
            <h1 class="page-title">Manage Genres</h1>
            <p class="page-subtitle">View, add, rename, or delete comic genres in your library</p>
        </div>

        <!-- Add New Genre Box -->
        <div class="card">
            <h2 style="font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #818cf8;">Add New Genre</h2>
            <form id="form-add-genre" style="display: flex; gap: 8px; max-width: 450px;">
                <input type="text" id="new-genre-name" class="form-control" placeholder="Enter new genre name (e.g. Action, Romance...)..." required>
                <button type="submit" class="btn btn-primary" style="white-space: nowrap;">Add Genre</button>
            </form>
        </div>

        <!-- Genres List Box -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 16px; font-weight: 700; color: var(--text-main);" id="genres-count-heading">Genres List</h2>
                <span style="font-size: 12px; color: var(--text-dim);">(Click on a genre to view comics)</span>
            </div>
            <div id="genres-list" class="genre-manage-grid">
                <div style="grid-column: 1 / -1; text-align: center; padding: 30px 0; color: var(--text-dim);">Loading genres...</div>
            </div>
        </div>

        <!-- Selected Genre Comics Area -->
        <div id="genre-comics-section" style="display: none; margin-top: 30px;">
            <div class="page-header" style="border-top: 1px solid var(--border-color); padding-top: 24px;">
                <h2 class="page-title" style="font-size: 20px;">
                    Comics in genre: <span id="selected-genre-title" style="color: var(--primary);">---</span>
                </h2>
                <p class="page-subtitle" id="selected-genre-count">0 comics</p>
            </div>
            <div id="genre-comics-grid" class="comic-grid"></div>
        </div>
    </main>

    <!-- Modal Popup: Rename Genre -->
    <div id="modal-rename-genre" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Rename Genre</h3>
                <button type="button" class="modal-close" onclick="closeRenameModal()">&times;</button>
            </div>
            <form id="form-rename-genre">
                <input type="hidden" id="rename-genre-id">
                <div class="form-group">
                    <label class="form-label">New genre name:</label>
                    <input type="text" id="rename-genre-name" class="form-control" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeRenameModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Load JavaScript utilities -->
    <script src="app.js"></script>
    <script>
        let allGenres = [];
        let selectedGenreId = null;

        /**
         * Load all genres from backend API
         */
        async function loadGenres() {
            const listEl = document.getElementById('genres-list');
            try {
                allGenres = await api.getGenres();
                document.getElementById('genres-count-heading').textContent = `Genres List (${allGenres.length})`;

                if (allGenres.length === 0) {
                    listEl.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 30px 0; color: var(--text-dim);">No genres found. Add a new genre above!</div>';
                    return;
                }

                listEl.innerHTML = allGenres.map(genre => `
                    <div class="genre-item-card ${selectedGenreId === genre.id ? 'active' : ''}" data-id="${genre.id}" onclick="selectGenre(${genre.id}, '${genre.name}')">
                        <div class="genre-name-box">
                            <span>${genre.name}</span>
                            <span class="genre-count-badge">${genre.comic_count} comics</span>
                        </div>
                        <div class="genre-actions" onclick="event.stopPropagation();">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="openRenameModal(${genre.id}, '${genre.name}')" title="Rename genre">Edit</button>
                            <button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteGenre(${genre.id}, '${genre.name}')" title="Delete genre">Delete</button>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                listEl.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 30px 0; color: var(--danger);">Error loading genres: ${err.message}</div>`;
            }
        }

        /**
         * Select a genre to load comics
         */
        async function selectGenre(genreId, genreName) {
            selectedGenreId = genreId;
            document.querySelectorAll('.genre-item-card').forEach(el => el.classList.remove('active'));
            const targetCard = document.querySelector(`.genre-item-card[data-id="${genreId}"]`);
            if (targetCard) targetCard.classList.add('active');

            const section = document.getElementById('genre-comics-section');
            const grid = document.getElementById('genre-comics-grid');
            const title = document.getElementById('selected-genre-title');
            const count = document.getElementById('selected-genre-count');

            title.textContent = genreName;
            grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-dim);">Loading comics...</div>';
            section.style.display = 'block';
            section.scrollIntoView({ behavior: 'smooth' });

            try {
                const comics = await api.getComicsByGenre(genreId);
                count.textContent = `${comics.length} comics`;

                if (comics.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">No comics found in this genre.</div>';
                    return;
                }

                grid.innerHTML = comics.map(comic => {
                    const coverUrl = api.getCoverUrl(comic.cover_filename);
                    const genresHtml = (comic.genres || []).slice(0, 3).map(g => `<span class="tag-chip">${g}</span>`).join('');
                    const titleSafe = (comic.title || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

                    return `
                        <div class="comic-card" onclick="window.location.href='detail.html?id=${comic.id}'" style="cursor: pointer;">
                            <div class="card-thumb-wrapper">
                                ${comic.gallery_id ? `<span class="card-id-badge">${comic.gallery_id}</span>` : ''}
                                <button type="button" class="btn-card-delete" onclick="handleDeleteComicCard(event, ${comic.id}, '${titleSafe}')" title="Delete this comic">
                                    Delete
                                </button>
                                <img src="${coverUrl}" alt="${titleSafe}" class="card-thumb" referrerpolicy="no-referrer" onerror="this.src='assets/rem.jpg'">
                            </div>
                            <div class="card-body">
                                <div class="card-title" title="${titleSafe}">${comic.title}</div>
                                <div class="card-author">${comic.author || 'Unknown Author'}</div>
                                <div class="card-tags">${genresHtml}</div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--danger);">Error: ${err.message}</div>`;
            }
        }

        /**
         * Quick delete comic card
         */
        function handleDeleteComicCard(event, comicId, title) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            showConfirmModal({
                title: 'Confirm Delete Comic',
                message: `Are you sure you want to permanently delete <strong>"${title}"</strong>?<br><br><span style="color: var(--danger); font-size: 13px;">This action will delete all chapters and associated cover images, and cannot be undone!</span>`,
                confirmText: 'Delete Permanently',
                cancelText: 'Cancel',
                type: 'danger',
                onConfirm: async () => {
                    await api.deleteComic(comicId);
                    showToast(`Comic "${title}" deleted successfully!`, 'success');
                    loadGenres();
                    if (selectedGenreId) {
                        selectGenre(selectedGenreId, document.getElementById('selected-genre-title').textContent);
                    }
                }
            });
        }

        document.getElementById('form-add-genre').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('new-genre-name');
            const name = input.value.trim();
            if (!name) return;

            try {
                await api.createGenre(name);
                showToast(`Added genre "${name}"!`, 'success');
                input.value = '';
                loadGenres();
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        function openRenameModal(id, name) {
            document.getElementById('rename-genre-id').value = id;
            document.getElementById('rename-genre-name').value = name;
            document.getElementById('modal-rename-genre').classList.add('active');
        }

        function closeRenameModal() {
            document.getElementById('modal-rename-genre').classList.remove('active');
        }

        document.getElementById('form-rename-genre').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = parseInt(document.getElementById('rename-genre-id').value, 10);
            const newName = document.getElementById('rename-genre-name').value.trim();
            if (!newName) return;

            try {
                await api.renameGenre(id, newName);
                showToast(`Genre renamed to "${newName}"!`, 'success');
                closeRenameModal();
                loadGenres();
                if (selectedGenreId === id) {
                    selectGenre(id, newName);
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        function confirmDeleteGenre(id, name) {
            showConfirmModal({
                title: 'Confirm Delete Genre',
                message: `Are you sure you want to delete the genre <strong>"${name}"</strong>?<br><br><span style="color: var(--warning); font-size: 13px;">This genre will be removed from all associated comics in the library.</span>`,
                confirmText: 'Delete Genre',
                cancelText: 'Cancel',
                type: 'danger',
                onConfirm: async () => {
                    await api.deleteGenre(id);
                    showToast(`Genre "${name}" deleted successfully!`, 'success');
                    if (selectedGenreId === id) {
                        document.getElementById('genre-comics-section').style.display = 'none';
                        selectedGenreId = null;
                    }
                    loadGenres();
                }
            });
        }

        loadGenres();
    </script>
</body>
</html>
