<!--
  HManga Library — Trang Chi Tiết Bộ Truyện (detail.html)
  =======================================================
  Nhiệm vụ:
  1. Hiển thị thông tin tổng quan của bộ truyện: Ảnh bìa, Tên truyện, Tác giả, Thể loại.
  2. Hiển thị danh sách các chương (Chapters) kèm số trang và liên kết vào trình đọc (reader.html).
  3. Cung cấp Modal Sửa thông tin truyện (Đổi tên, Tác giả với AuthorAutocomplete, Thể loại với GenreSelector).
  4. Cung cấp Modal Thêm chương mới cho bộ truyện.
  5. Cung cấp Modal Chỉnh sửa chương (Đổi số thứ tự chương, đổi tên chương).
  6. Cung cấp chức năng Xóa chương và Xóa vĩnh viễn toàn bộ bộ truyện.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Details — HManga Library</title>
    <!-- Favicon website -->
    <link rel="icon" type="image/jpeg" href="assets/rem.jpg">
    <!-- Stylesheet dùng chung -->
    <link rel="stylesheet" href="style.css">
    <style>
        .detail-header {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
        }
        .detail-cover-box {
            width: 300px;
            flex-shrink: 0;
        }
        .detail-cover {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }
        .detail-info {
            flex: 1;
            min-width: 0;
        }
        .chapter-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }
        .chapter-row:hover {
            border-color: var(--border-hover);
        }
        .chapter-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        @media (max-width: 640px) {
            .detail-header {
                flex-direction: column;
                align-items: center;
            }
            .detail-cover-box {
                width: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- 1. Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="assets/rem.jpg" alt="HManga Logo" class="nav-logo">
                <span class="nav-brand-text">HManga</span>
            </a>
            <!-- Quick Search Form -->
            <div class="nav-center">
                <form class="quick-search-form" id="quickSearchForm" action="index.html" method="GET" autocomplete="off">
                    <div class="quick-search-wrapper">
                        <input type="search" name="s" id="inputQuickSearch" class="quick-search-input" placeholder="Search comics..." autocomplete="off">
                    </div>
                    <a href="search.html" id="btnGoAdvanced" class="btn-go-advanced" title="Advanced Search">
                        <span>Advanced Search</span>
                    </a>
                </form>
            </div>
            <div class="nav-links">
                <a href="genres.html" class="nav-link">Genres</a>
                <a href="authors.html" class="nav-link">Authors</a>
                <a href="add.html" class="btn-add">
                    <span>Add Comic</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- 2. Main Content Area -->
    <main class="main-content" style="max-width: 900px;">
        <!-- Comic Detail Content Box -->
        <div id="comic-detail-content">
            <div style="text-align: center; padding: 60px 0; color: var(--text-dim);">Loading comic details...</div>
        </div>

        <!-- Chapters List Card -->
        <div class="card" id="chapters-card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="font-size: 18px; font-weight: 700; color: var(--text-main);" id="chapters-heading">Chapters (0)</h2>
                <button type="button" id="btn-open-add-chapter" class="btn btn-primary btn-sm">Add New Chapter</button>
            </div>
            <div id="chapter-list-container"></div>
        </div>
    </main>

    <!-- ==================== MODAL: EDIT COMIC ==================== -->
    <div id="modal-edit-comic" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Edit Comic Information</h3>
                <button type="button" class="modal-close" onclick="closeModal('modal-edit-comic')">&times;</button>
            </div>
            <form id="form-edit-comic">
                <div class="form-group">
                    <label class="form-label">Comic title *</label>
                    <input type="text" id="edit-comic-title" class="form-control" required>
                </div>
                <!-- Author Autocomplete -->
                <div class="form-group">
                    <label class="form-label">Author</label>
                    <input type="text" id="edit-comic-author" class="form-control" placeholder="Type to search existing authors or create a new one..." autocomplete="off">
                </div>
                <!-- Genre Selector -->
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label class="form-label" style="margin: 0;">Select genres:</label>
                        <a href="genres.html" target="_blank" style="font-size: 12px; color: var(--primary); text-decoration: none;">Manage genres</a>
                    </div>
                    <div id="edit-genres-container"></div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('modal-edit-comic')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== MODAL: ADD CHAPTER ==================== -->
    <div id="modal-add-chapter" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Add New Chapter</h3>
                <button type="button" class="modal-close" onclick="closeModal('modal-add-chapter')">&times;</button>
            </div>
            <form id="form-add-chapter">
                <div class="form-group">
                    <label class="form-label">Paste chapter image URL (nhentai):</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="new-chap-url" class="form-control" placeholder="https://t3.nhentai.net/galleries/4126277/1t.webp" required>
                        <button type="button" id="btn-parse-new-chap" class="btn btn-secondary btn-sm" style="white-space: nowrap;">Parse</button>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Chapter number *</label>
                        <input type="number" id="new-chap-num" class="form-control" step="0.5" min="0" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Chapter title (Optional)</label>
                        <input type="text" id="new-chap-title" class="form-control" placeholder="Optional...">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Start Page *</label>
                        <input type="number" id="new-chap-start-page" class="form-control" value="1" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">End Page *</label>
                        <input type="number" id="new-chap-end-page" class="form-control" min="1" placeholder="Last page..." required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('modal-add-chapter')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Chapter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== MODAL: EDIT CHAPTER ==================== -->
    <div id="modal-edit-chapter" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Edit Chapter</h3>
                <button type="button" class="modal-close" onclick="closeModal('modal-edit-chapter')">&times;</button>
            </div>
            <form id="form-edit-chapter">
                <input type="hidden" id="edit-chap-id">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Chapter number *</label>
                        <input type="number" id="edit-chap-num" class="form-control" step="0.5" min="0" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Chapter title:</label>
                        <input type="text" id="edit-chap-title" class="form-control" placeholder="Optional...">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Start Page *</label>
                        <input type="number" id="edit-chap-start-page" class="form-control" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">End Page *</label>
                        <input type="number" id="edit-chap-end-page" class="form-control" min="1" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('modal-edit-chapter')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Chapter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Nạp file JavaScript tiện ích dùng chung -->
    <script src="app.js"></script>
    <script>
        // Lấy ID bộ truyện từ Query Parameter (VD: detail.html?id=5 hoặc detail.html?id=001-48410)
        const urlParams = new URLSearchParams(window.location.search);
        let comicId = urlParams.get('id');
        let currentComic = null;
        let editGenreSelector = null;
        let editAuthorAutocomplete = null;

        /** Đóng một modal popup theo ID */
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        /** Mở một modal popup theo ID */
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        /**
         * Tải toàn bộ thông tin chi tiết của bộ truyện và các chương từ Backend API
         */
        async function loadComicDetail() {
            if (!comicId) {
                document.getElementById('comic-detail-content').innerHTML = `
                    <div style="text-align: center; padding: 60px 0; color: var(--danger);">
                        Invalid comic ID! <br><br>
                        <a href="index.html" class="btn btn-secondary">&larr; Back to Homepage</a>
                    </div>
                `;
                return;
            }

            try {
                currentComic = await api.getComic(comicId);
                comicId = currentComic.id;
                const coverUrl = api.getCoverUrl(currentComic.cover_filename);
                const genresHtml = (currentComic.genres || []).map(g => `<a href="genres.html" class="tag-chip" style="font-size: 11px; padding: 3px 8px; text-decoration: none;">${g}</a>`).join('');

                document.getElementById('comic-detail-content').innerHTML = `
                    <div class="detail-header">
                        <div class="detail-cover-box">
                            <img src="${coverUrl}" alt="${currentComic.title}" class="detail-cover" referrerpolicy="no-referrer" onerror="this.src='assets/rem.jpg'">
                        </div>
                        <div class="detail-info">
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap;">
                                <span class="badge" style="background: rgba(99, 102, 241, 0.2); color: #c7d2fe; font-family: monospace; font-weight: 700; font-size: 13px;">ID: ${currentComic.gallery_id || currentComic.id}</span>
                                <h1 style="font-size: 24px; font-weight: 800; color: var(--text-main);">${currentComic.title}</h1>
                            </div>
                            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 12px;">Author: <a href="authors.html" style="color: var(--text-main); font-weight: 500; text-decoration: none;">${currentComic.author || 'Unknown'}</a></p>
                            <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;">
                                ${genresHtml || '<span style="color: var(--text-dim); font-size: 12px;">No genres selected</span>'}
                            </div>
                            <div style="display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap;">
                                <button type="button" onclick="openEditComicModal()" class="btn btn-secondary btn-sm">Edit Details</button>
                                <button type="button" onclick="confirmDeleteComic()" class="btn btn-danger btn-sm">Delete Comic</button>
                            </div>
                        </div>
                    </div>
                `;

                const chapters = [...(currentComic.chapters || [])].sort((a, b) => a.chapter_number - b.chapter_number);
                document.getElementById('chapters-heading').textContent = `Chapters (${chapters.length})`;
                const chapContainer = document.getElementById('chapter-list-container');
                
                if (chapters.length === 0) {
                    chapContainer.innerHTML = `<p style="text-align: center; color: var(--text-dim); padding: 30px 0;">No chapters yet. Click "Add New Chapter" to add!</p>`;
                } else {
                    chapContainer.innerHTML = chapters.map(ch => {
                        const startP = ch.start_page || 1;
                        const endP = ch.end_page || ch.total_pages || startP;
                        const pageCount = ch.total_pages || (endP - startP + 1);

                        return `
                            <div class="chapter-row">
                                <a href="reader.html?id=${ch.id}&comic_id=${comicId}" class="chapter-link">
                                    <span style="font-weight: 700; color: var(--primary); font-family: monospace; font-size: 15px;">Ch.${ch.chapter_number}</span>
                                    <span style="font-size: 14px; font-weight: 500; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${ch.title || ''}</span>
                                    <span style="color: var(--text-dim); font-size: 12px;">(${pageCount} pages: page ${startP} &rarr; ${endP})</span>
                                </a>
                                <div style="display: flex; gap: 6px;">
                                    <button type="button" class="btn btn-secondary btn-sm" onclick="handleEditChapterBtn(${ch.id})" title="Edit chapter">Edit</button>
                                    <button type="button" class="btn btn-danger btn-sm" onclick="handleDeleteChapterBtn(${ch.id}, ${ch.chapter_number})" title="Delete chapter">Delete</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                document.getElementById('chapters-card').style.display = 'block';

            } catch (err) {
                document.getElementById('comic-detail-content').innerHTML = `
                    <div style="text-align: center; padding: 60px 0; color: var(--danger);">
                        Failed to load comic details! (${err.message})
                    </div>
                `;
            }
        }

        // ==================== EDIT COMIC ====================
        async function openEditComicModal() {
            if (!currentComic) return;
            document.getElementById('edit-comic-title').value = currentComic.title;
            document.getElementById('edit-comic-author').value = currentComic.author || '';

            if (!editGenreSelector) {
                editGenreSelector = new GenreSelectorComponent('edit-genres-container', [], currentComic.genres || []);
            } else {
                editGenreSelector.setSelectedGenres(currentComic.genres || []);
            }

            try {
                const genres = await api.getGenres();
                editGenreSelector.setAvailableGenres(genres);
                editGenreSelector.setSelectedGenres(currentComic.genres || []);
            } catch {}

            if (!editAuthorAutocomplete) {
                editAuthorAutocomplete = new AuthorAutocompleteComponent('edit-comic-author');
            }
            try {
                const authors = await api.getAuthors();
                editAuthorAutocomplete.setAuthors(authors);
            } catch {}

            openModal('modal-edit-comic');
        }

        document.getElementById('form-edit-comic').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await api.updateComic(comicId, {
                    title: document.getElementById('edit-comic-title').value.trim(),
                    author: document.getElementById('edit-comic-author').value.trim() || undefined,
                    genres: editGenreSelector.getSelectedGenres()
                });
                closeModal('modal-edit-comic');
                showToast('Comic information updated successfully!', 'success');
                loadComicDetail();
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // ==================== ADD CHAPTER ====================
        document.getElementById('btn-open-add-chapter').addEventListener('click', () => {
            const chapters = currentComic?.chapters || [];
            const nextNum = chapters.length > 0 ? Math.max(...chapters.map(c => c.chapter_number)) + 1 : 1;
            document.getElementById('new-chap-num').value = nextNum;
            document.getElementById('new-chap-url').value = '';
            document.getElementById('new-chap-title').value = '';

            const maxEndPage = chapters.length > 0 ? Math.max(...chapters.map(c => c.end_page || c.total_pages || 0)) : 0;
            document.getElementById('new-chap-start-page').value = maxEndPage > 0 ? maxEndPage + 1 : 1;
            document.getElementById('new-chap-end-page').value = '';

            openModal('modal-add-chapter');
        });

        document.getElementById('btn-parse-new-chap').addEventListener('click', () => {
            const url = document.getElementById('new-chap-url').value.trim();
            const parsed = parseMangaUrl(url);
            if (!parsed) {
                showToast('Invalid nhentai URL format!', 'warning');
            } else {
                showToast(`Detected Gallery ID: ${parsed.galleryId}`, 'info');
                if (parsed.pageNumber) {
                    document.getElementById('new-chap-start-page').value = parsed.pageNumber;
                }
            }
        });

        document.getElementById('form-add-chapter').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('new-chap-url').value.trim();
            const chapterNum = parseFloat(document.getElementById('new-chap-num').value);
            const startPage = parseInt(document.getElementById('new-chap-start-page').value, 10) || 1;
            const endPage = parseInt(document.getElementById('new-chap-end-page').value, 10);
            const title = document.getElementById('new-chap-title').value.trim();

            if (endPage < startPage) {
                showToast('End page must be greater than or equal to start page!', 'warning');
                return;
            }

            try {
                await api.createChapter(comicId, {
                    chapter_number: chapterNum,
                    title: title || undefined,
                    base_url: url,
                    start_page: startPage,
                    end_page: endPage
                });
                closeModal('modal-add-chapter');
                showToast(`Chapter ${chapterNum} (${endPage - startPage + 1} pages) added successfully!`, 'success');
                loadComicDetail();
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // ==================== EDIT CHAPTER ====================
        function findChapterById(id) {
            return (currentComic?.chapters || []).find(c => c.id === id);
        }

        function handleEditChapterBtn(chapId) {
            const ch = findChapterById(chapId);
            if (!ch) return;
            const startP = ch.start_page || 1;
            const endP = ch.end_page || ch.total_pages || startP;
            openEditChapterModal(ch.id, ch.chapter_number, ch.title || '', startP, endP);
        }

        function openEditChapterModal(id, num, title, startPage, endPage) {
            document.getElementById('edit-chap-id').value = id;
            document.getElementById('edit-chap-num').value = num;
            document.getElementById('edit-chap-title').value = title;
            document.getElementById('edit-chap-start-page').value = startPage || 1;
            document.getElementById('edit-chap-end-page').value = endPage || startPage || 1;
            openModal('modal-edit-chapter');
        }

        document.getElementById('form-edit-chapter').addEventListener('submit', async (e) => {
            e.preventDefault();
            const chapId = parseInt(document.getElementById('edit-chap-id').value, 10);
            const chapNum = parseFloat(document.getElementById('edit-chap-num').value);
            const chapTitle = document.getElementById('edit-chap-title').value.trim();
            const startPage = parseInt(document.getElementById('edit-chap-start-page').value, 10) || 1;
            const endPage = parseInt(document.getElementById('edit-chap-end-page').value, 10);

            if (endPage < startPage) {
                showToast('End page must be greater than or equal to start page!', 'warning');
                return;
            }

            try {
                await api.updateChapter(chapId, {
                    chapter_number: chapNum,
                    title: chapTitle || undefined,
                    start_page: startPage,
                    end_page: endPage
                });
                closeModal('modal-edit-chapter');
                showToast('Chapter updated successfully!', 'success');
                loadComicDetail();
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // ==================== DELETE CHAPTER & COMIC ====================
        function handleDeleteChapterBtn(chapId, chapNumber) {
            const ch = findChapterById(chapId);
            const titleDisplay = ch?.title ? ` - "${ch.title}"` : '';

            showConfirmModal({
                title: 'Confirm Delete Chapter',
                message: `Are you sure you want to delete <strong>Chapter ${chapNumber}${titleDisplay}</strong>?<br><br><span style="color: var(--danger); font-size: 13px;">This action will remove this chapter from the comic and cannot be undone!</span>`,
                confirmText: 'Delete Chapter',
                cancelText: 'Cancel',
                type: 'danger',
                onConfirm: async () => {
                    await api.deleteChapter(chapId);
                    showToast(`Chapter ${chapNumber} deleted successfully!`, 'success');
                    loadComicDetail();
                }
            });
        }

        function confirmDeleteComic() {
            if (!currentComic) return;
            const title = currentComic.title || 'this comic';

            showConfirmModal({
                title: 'Confirm Delete Comic',
                message: `Are you sure you want to permanently delete <strong>"${title}"</strong>?<br><br><span style="color: var(--danger); font-size: 13px;">This action will delete all chapters and associated cover images, and cannot be undone!</span>`,
                confirmText: 'Delete Permanently',
                cancelText: 'Cancel',
                type: 'danger',
                onConfirm: async () => {
                    await api.deleteComic(comicId);
                    showToast(`Comic "${title}" deleted successfully!`, 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 600);
                }
            });
        }

        loadComicDetail();
    </script>
</body>
</html>
