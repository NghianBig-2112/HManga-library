<!--
  HManga Library — Trang Chi Tiết Bộ Truyện (detail.html)
  =======================================================
  Nhiệm vụ:
  1. Hiển thị thông tin tổng quan của bộ truyện: Ảnh bìa, Tên truyện, Tác giả, Thể loại.
  2. Hiển thị danh sách các chương (Chapters) kèm số trang và liên kết vào trình đọc (reader.html).
  3. Cung cấp Modal Sửa thông tin truyện (Đổi tên, Tác giả với AuthorAutocomplete, Thể loại với GenreSelector).
  4. Cung cấp Modal Thêm chương mới cho bộ truyện.
  5. Cung cấp Modal Chỉnh sửa chương (Đổi số thứ tự chương, đổi tên chương).
  6. Cung cấp chức năng Xóa chương và Xóa vĩnh viễn toàn bộ bộ truyện.
-->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Truyện — HManga Library</title>
    <!-- Favicon website -->
    <link rel="icon" type="image/jpeg" href="assets/rem.jpg">
    <!-- Stylesheet dùng chung -->
    <link rel="stylesheet" href="style.css">
    <style>
        .detail-header {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
            background: var(--bg-card);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        .detail-cover-box {
            width: 300px;
            flex-shrink: 0;
        }
        .detail-cover {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }
        .detail-info {
            flex: 1;
            min-width: 0;
        }
        .chapter-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(6, 10, 24, 0.25);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }
        .chapter-row:hover {
            border-color: var(--border-hover);
            background: rgba(20, 28, 52, 0.75);
            transform: translateX(3px);
        }
        .chapter-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        @media (max-width: 640px) {
            .detail-header {
                flex-direction: column;
                align-items: center;
            }
            .detail-cover-box {
                width: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- 1. Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="assets/rem.jpg" alt="Rem" class="nav-logo">
                <span class="nav-brand-text">HManga</span>
            </a>
        </div>
    </nav>

    <!-- 2. Main Content Area -->
    <main class="main-content" style="max-width: 900px;">
        <!-- Comic Detail Content Box -->
        <div id="comic-detail-content">
            <div style="text-align: center; padding: 60px 0; color: var(--text-dim);">Đang tải thông tin truyện...</div>
        </div>

        <!-- Chapters List Card -->
        <div class="card" id="chapters-card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="font-size: 18px; font-weight: 700; color: var(--text-main);" id="chapters-heading">Danh sách Chapter (0)</h2>
                <button type="button" id="btn-open-add-chapter" class="btn btn-primary btn-sm">Thêm Chapter mới</button>
            </div>
            <div id="chapter-list-container"></div>
        </div>
    </main>

    <!-- ==================== MODAL: THÊM CHAPTER ==================== -->
    <div id="modal-add-chapter" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Thêm Chapter Mới (Chỉ cần nhập ID)</h3>
                <button type="button" class="modal-close" onclick="closeModal('modal-add-chapter')">&times;</button>
            </div>
            <form id="form-add-chapter">
                <div class="form-group">
                    <label class="form-label">Mã số ID của Chapter trên NHentai *</label>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" id="new-chap-gallery-id" class="form-control" placeholder="Ví dụ: 524984" required autofocus>
                    <div style="margin-top: 6px; font-size: 12px; color: var(--text-dim);">
                        Hệ thống sẽ tự động lấy toàn bộ số trang và link ảnh từ ID này.
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Số thứ tự Chapter *</label>
                        <input type="number" id="new-chap-num" class="form-control" step="0.5" min="0" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tiêu đề Chapter (Tùy chọn)</label>
                        <input type="text" id="new-chap-title" class="form-control" placeholder="Tùy chọn...">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('modal-add-chapter')">Hủy</button>
                    <button type="submit" id="btn-submit-add-chap" class="btn btn-primary">
                        <span id="btn-add-chap-text">Thêm Chapter</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== MODAL: SỬA CHAPTER ==================== -->
    <div id="modal-edit-chapter" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Chỉnh sửa Chapter</h3>
                <button type="button" class="modal-close" onclick="closeModal('modal-edit-chapter')">&times;</button>
            </div>
            <form id="form-edit-chapter">
                <input type="hidden" id="edit-chap-id">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Số thứ tự Chapter *</label>
                        <input type="number" id="edit-chap-num" class="form-control" step="0.5" min="0" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tiêu đề Chapter:</label>
                        <input type="text" id="edit-chap-title" class="form-control" placeholder="Tùy chọn...">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Trang bắt đầu *</label>
                        <input type="number" id="edit-chap-start-page" class="form-control" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Trang kết thúc *</label>
                        <input type="number" id="edit-chap-end-page" class="form-control" min="1" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('modal-edit-chapter')">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu Chapter</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Nạp file JavaScript tiện ích dùng chung -->
    <script src="app.js?v=3.1"></script>
    <script>
        // Lấy ID bộ truyện từ Query Parameter (VD: detail.html?id=5)
        const urlParams = new URLSearchParams(window.location.search);
        let comicId = urlParams.get('id');
        let currentComic = null;

        /** Đóng một modal popup theo ID */
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        /** Mở một modal popup theo ID */
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        /**
         * Tải toàn bộ thông tin chi tiết của bộ truyện và các chương từ Backend API
         */
        async function loadComicDetail() {
            if (!comicId) {
                document.getElementById('comic-detail-content').innerHTML = `
                    <div style="text-align: center; padding: 60px 0; color: var(--danger);">
                        Mã ID truyện không hợp lệ! <br><br>
                        <a href="index.html" class="btn btn-secondary">Quay lại Thư viện</a>
                    </div>
                `;
                return;
            }

            try {
                currentComic = await api.getComic(comicId);
                comicId = currentComic.id;
                const coverUrl = api.getCoverUrl(currentComic.cover_filename);
                const genresHtml = (currentComic.genres || []).map(g => `<a href="index.html?genre=${encodeURIComponent(g)}" class="tag-chip" style="font-size: 11px; padding: 3px 8px; text-decoration: none;">${g}</a>`).join('');

                const authors = (currentComic.authors && currentComic.authors.length > 0)
                    ? currentComic.authors
                    : (currentComic.author ? currentComic.author.split(',').map(a => a.trim()) : ['Chưa rõ']);

                const authorsHtml = authors.map(a => 
                    `<a href="index.html?author=${encodeURIComponent(a)}" class="author-link" style="color: var(--text-main); font-weight: 600; text-decoration: none; border-bottom: 1px dotted var(--primary); transition: color 0.15s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-main)'">${a}</a>`
                ).join(', ');

                document.getElementById('comic-detail-content').innerHTML = `
                    <div class="detail-header">
                        <div class="detail-cover-box">
                            <img src="${coverUrl}" alt="${currentComic.title}" class="detail-cover" referrerpolicy="no-referrer" onerror="this.src='assets/rem.jpg'">
                        </div>
                        <div class="detail-info">
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap;">
                                <span class="badge" style="background: rgba(99, 102, 241, 0.2); color: #c7d2fe; font-family: monospace; font-weight: 700; font-size: 13px;">ID: ${currentComic.gallery_id || currentComic.id}</span>
                                <h1 style="font-size: 24px; font-weight: 800; color: var(--text-main);">${currentComic.title}</h1>
                            </div>
                            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 12px;">Tác giả: ${authorsHtml}</p>
                            <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;">
                                ${genresHtml || '<span style="color: var(--text-dim); font-size: 12px;">Chưa chọn thể loại</span>'}
                            </div>
                            <div style="display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap;">
                                <button type="button" onclick="confirmDeleteComic()" class="btn btn-danger btn-sm">Xóa truyện</button>
                            </div>
                        </div>
                    </div>
                `;

                const chapters = [...(currentComic.chapters || [])].sort((a, b) => a.chapter_number - b.chapter_number);
                document.getElementById('chapters-heading').textContent = `Danh sách Chapter (${chapters.length})`;
                const chapContainer = document.getElementById('chapter-list-container');
                
                if (chapters.length === 0) {
                    chapContainer.innerHTML = `<p style="text-align: center; color: var(--text-dim); padding: 30px 0;">Chưa có chapter nào. Nhấn "Thêm Chapter mới" để thêm!</p>`;
                } else {
                    chapContainer.innerHTML = chapters.map(ch => {
                        const startP = ch.start_page || 1;
                        const endP = ch.end_page || ch.total_pages || startP;
                        const pageCount = ch.total_pages || (endP - startP + 1);

                        return `
                            <div class="chapter-row">
                                <a href="reader.html?id=${ch.id}&comic_id=${comicId}" class="chapter-link">
                                    <span style="font-weight: 700; color: var(--primary); font-family: monospace; font-size: 15px;">Ch.${ch.chapter_number}</span>
                                    <span style="font-size: 14px; font-weight: 500; color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${ch.title || ''}</span>
                                    <span style="color: var(--text-dim); font-size: 12px;">(${pageCount} trang: trang ${startP} đến ${endP})</span>
                                </a>
                                <div style="display: flex; gap: 6px;">
                                    <button type="button" class="btn btn-secondary btn-sm" onclick="handleEditChapterBtn(${ch.id})" title="Sửa chapter">Sửa</button>
                                    <button type="button" class="btn btn-danger btn-sm" onclick="handleDeleteChapterBtn(${ch.id}, ${ch.chapter_number})" title="Xóa chapter">Xóa</button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                document.getElementById('chapters-card').style.display = 'block';

            } catch (err) {
                document.getElementById('chapters-card').style.display = 'none';
                document.getElementById('comic-detail-content').innerHTML = `
                    <div style="text-align: center; padding: 60px 0; color: var(--danger);">
                        Không thể tải thông tin truyện! (${err.message})
                    </div>
                `;
            }
        }
        // ==================== THÊM CHAPTER ====================
        document.getElementById('btn-open-add-chapter').addEventListener('click', () => {
            const chapters = currentComic?.chapters || [];
            const nextNum = chapters.length > 0 ? Math.max(...chapters.map(c => c.chapter_number || 0)) + 1 : 1;
            document.getElementById('new-chap-num').value = nextNum;
            document.getElementById('new-chap-gallery-id').value = '';
            document.getElementById('new-chap-title').value = '';

            openModal('modal-add-chapter');
            setTimeout(() => document.getElementById('new-chap-gallery-id').focus(), 100);
        });

        document.getElementById('form-add-chapter').addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawId = document.getElementById('new-chap-gallery-id').value.trim();
            const galleryId = parseInt(rawId, 10);
            if (!galleryId || isNaN(galleryId) || galleryId <= 0) {
                showToast('Vui lòng nhập mã ID Chapter hợp lệ!', 'warning');
                return;
            }

            const chapterNum = parseFloat(document.getElementById('new-chap-num').value);
            const title = document.getElementById('new-chap-title').value.trim();

            const btnSubmit = document.getElementById('btn-submit-add-chap');
            const btnText = document.getElementById('btn-add-chap-text');
            btnSubmit.disabled = true;
            btnText.textContent = 'Đang tải dữ liệu chapter...';

            try {
                showToast(`Đang lấy dữ liệu từ NHentai cho Chapter #${galleryId}...`, 'info');
                const newCh = await api.addChapterById(comicId, {
                    gallery_id: galleryId,
                    chapter_number: chapterNum,
                    title: title || undefined
                });
                closeModal('modal-add-chapter');
                showToast(`Đã thêm thành công Chapter ${chapterNum} (${newCh.total_pages || 0} trang)!`, 'success');
                loadComicDetail();
            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btnSubmit.disabled = false;
                btnText.textContent = 'Thêm Chapter';
            }
        });

        // ==================== SỬA CHAPTER ====================
        function findChapterById(id) {
            return (currentComic?.chapters || []).find(c => c.id === id);
        }

        function handleEditChapterBtn(chapId) {
            const ch = findChapterById(chapId);
            if (!ch) return;
            const startP = ch.start_page || 1;
            const endP = ch.end_page || ch.total_pages || startP;
            openEditChapterModal(ch.id, ch.chapter_number, ch.title || '', startP, endP);
        }

        function openEditChapterModal(id, num, title, startPage, endPage) {
            document.getElementById('edit-chap-id').value = id;
            document.getElementById('edit-chap-num').value = num;
            document.getElementById('edit-chap-title').value = title;
            document.getElementById('edit-chap-start-page').value = startPage || 1;
            document.getElementById('edit-chap-end-page').value = endPage || startPage || 1;
            openModal('modal-edit-chapter');
        }

        document.getElementById('form-edit-chapter').addEventListener('submit', async (e) => {
            e.preventDefault();
            const chapId = parseInt(document.getElementById('edit-chap-id').value, 10);
            const chapNum = parseFloat(document.getElementById('edit-chap-num').value);
            const chapTitle = document.getElementById('edit-chap-title').value.trim();
            const startPage = parseInt(document.getElementById('edit-chap-start-page').value, 10) || 1;
            const endPage = parseInt(document.getElementById('edit-chap-end-page').value, 10);

            if (!endPage || isNaN(endPage) || endPage < startPage) {
                showToast('Trang kết thúc phải là số hợp lệ và lớn hơn hoặc bằng trang bắt đầu!', 'warning');
                return;
            }

            try {
                await api.updateChapter(chapId, {
                    chapter_number: chapNum,
                    title: chapTitle || undefined,
                    start_page: startPage,
                    end_page: endPage
                });
                closeModal('modal-edit-chapter');
                showToast('Đã cập nhật chapter thành công!', 'success');
                loadComicDetail();
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // ==================== XÓA CHAPTER & XÓA TRUYỆN ====================
        function handleDeleteChapterBtn(chapId, chapNumber) {
            const ch = findChapterById(chapId);
            const titleDisplay = ch?.title ? ` - "${ch.title}"` : '';

            showConfirmModal({
                title: 'Xác nhận xóa Chapter',
                message: `Bạn có chắc chắn muốn xóa <strong>Chapter ${chapNumber}${titleDisplay}</strong> không?<br><br><span style="color: var(--danger); font-size: 13px;">Hành động này sẽ xóa chapter khỏi bộ truyện và không thể hoàn tác!</span>`,
                confirmText: 'Xóa Chapter',
                cancelText: 'Hủy',
                type: 'danger',
                onConfirm: async () => {
                    await api.deleteChapter(chapId);
                    showToast(`Đã xóa Chapter ${chapNumber} thành công!`, 'success');
                    loadComicDetail();
                }
            });
        }

        function confirmDeleteComic() {
            if (!currentComic) return;
            const title = currentComic.title || 'bộ truyện này';

            showConfirmModal({
                title: 'Xác nhận xóa truyện',
                message: `Bạn có chắc chắn muốn xóa vĩnh viễn bộ truyện <strong>"${title}"</strong> không?<br><br><span style="color: var(--danger); font-size: 13px;">Hành động này sẽ xóa toàn bộ chapter và ảnh bìa liên quan, không thể hoàn tác!</span>`,
                confirmText: 'Xóa vĩnh viễn',
                cancelText: 'Hủy',
                type: 'danger',
                onConfirm: async () => {
                    await api.deleteComic(comicId);
                    showToast(`Đã xóa truyện "${title}" thành công!`, 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 600);
                }
            });
        }

        // Đóng modal khi click ra ngoài hoặc bấm phím ESC
        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
            }
        });

        loadComicDetail();
    </script>
</body>
</html>
