<!--
  HManga Library — Trang Quản Lý Tác Giả (authors.html)
  =====================================================
  Nhiệm vụ:
  1. Hiển thị danh sách tất cả các tác giả có trong thư viện kèm số lượng bộ truyện.
  2. Cung cấp chức năng Đổi tên tác giả hàng loạt (Batch Rename):
     - Khi đổi tên tác giả, tất cả các bộ truyện của tác giả đó sẽ tự động được cập nhật tên mới.
  3. Khi click vào một tác giả -> Hiển thị toàn bộ các tác phẩm của tác giả đó ở phía dưới.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Authors — HManga Library</title>
    <!-- Favicon website -->
    <link rel="icon" type="image/jpeg" href="assets/rem.jpg">
    <!-- Stylesheet dùng chung -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Lưới hiển thị danh sách các thẻ tác giả */
        .author-manage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        /* Thẻ hiển thị một tác giả */
        .author-item-card {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            cursor: pointer;
        }
        .author-item-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }
        .author-item-card.active {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }
        .author-name-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #c7d2fe;
            font-size: 14px;
        }
        .author-count-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- 1. Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="assets/rem.jpg" alt="HManga Logo" class="nav-logo">
                <span class="nav-brand-text">HManga</span>
            </a>
            <!-- Quick Search Form -->
            <div class="nav-center">
                <form class="quick-search-form" id="quickSearchForm" action="index.html" method="GET" autocomplete="off">
                    <div class="quick-search-wrapper">
                        <input type="search" name="s" id="inputQuickSearch" class="quick-search-input" placeholder="Search comics..." autocomplete="off">
                    </div>
                    <a href="search.html" id="btnGoAdvanced" class="btn-go-advanced" title="Advanced Search">
                        <span>Advanced Search</span>
                    </a>
                </form>
            </div>
            <div class="nav-links">
                <a href="genres.html" class="nav-link">Genres</a>
                <a href="authors.html" class="nav-link active">Authors</a>
                <a href="add.html" class="btn-add">
                    <span>Add Comic</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- 2. Main Content Area -->
    <main class="main-content">
        <!-- Page Title -->
        <div class="page-header">
            <h1 class="page-title">Manage Authors</h1>
            <p class="page-subtitle">View authors, batch rename across library, or browse comic works</p>
        </div>

        <!-- Authors List Box -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 16px; font-weight: 700; color: var(--text-main);" id="authors-count-heading">Authors List</h2>
                <span style="font-size: 12px; color: var(--text-dim);">(Click on an author to view works)</span>
            </div>
            <div id="authors-list" class="author-manage-grid">
                <div style="grid-column: 1 / -1; text-align: center; padding: 30px 0; color: var(--text-dim);">Loading authors...</div>
            </div>
        </div>

        <!-- Selected Author Comics Area -->
        <div id="author-comics-section" style="display: none; margin-top: 30px;">
            <div class="page-header" style="border-top: 1px solid var(--border-color); padding-top: 24px;">
                <h2 class="page-title" style="font-size: 20px;">
                    Works by: <span id="selected-author-title" style="color: var(--primary);">---</span>
                </h2>
                <p class="page-subtitle" id="selected-author-count">0 comics</p>
            </div>
            <div id="author-comics-grid" class="comic-grid"></div>
        </div>
    </main>

    <!-- Modal Popup: Batch Rename Author -->
    <div id="modal-rename-author" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Batch Rename Author</h3>
                <button type="button" class="modal-close" onclick="closeRenameModal()">&times;</button>
            </div>
            <form id="form-rename-author">
                <input type="hidden" id="rename-author-old">
                <div class="form-group">
                    <label class="form-label">Current author name:</label>
                    <input type="text" id="rename-author-display" class="form-control" disabled style="opacity: 0.7;">
                </div>
                <div class="form-group">
                    <label class="form-label">New author name (applied to all comics by this author):</label>
                    <input type="text" id="rename-author-new" class="form-control" placeholder="Enter new name..." required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeRenameModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Nạp file JavaScript tiện ích dùng chung -->
    <script src="app.js"></script>
    <script>
        let allAuthors = [];
        let selectedAuthorName = null;

        /**
         * Load all authors from backend API
         */
        async function loadAuthors() {
            const listEl = document.getElementById('authors-list');
            try {
                allAuthors = await api.getAuthors();
                document.getElementById('authors-count-heading').textContent = `Authors List (${allAuthors.length})`;

                if (allAuthors.length === 0) {
                    listEl.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 30px 0; color: var(--text-dim);">No authors found in library.</div>';
                    return;
                }

                listEl.innerHTML = allAuthors.map(item => {
                    const safeAuthor = (item.name || '').replace(/"/g, '&quot;');
                    return `
                    <div class="author-item-card ${selectedAuthorName === item.name ? 'active' : ''}" data-author="${safeAuthor}" onclick="selectAuthor('${safeAuthor}')">
                        <div class="author-name-box">
                            <span>${item.name}</span>
                            <span class="author-count-badge">${item.comic_count} comics</span>
                        </div>
                        <div onclick="event.stopPropagation();">
                            <button type="button" class="btn btn-secondary btn-sm" onclick="openRenameModal('${safeAuthor}')" title="Rename author">Edit</button>
                        </div>
                    </div>
                `}).join('');

            } catch (err) {
                listEl.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 30px 0; color: var(--danger);">Error loading authors: ${err.message}</div>`;
            }
        }

        /**
         * Select author to view works
         */
        async function selectAuthor(authorName) {
            selectedAuthorName = authorName;
            document.querySelectorAll('.author-item-card').forEach(el => el.classList.remove('active'));
            const targetCard = Array.from(document.querySelectorAll('.author-item-card')).find(el => el.getAttribute('data-author') === authorName);
            if (targetCard) targetCard.classList.add('active');

            const section = document.getElementById('author-comics-section');
            const grid = document.getElementById('author-comics-grid');
            const title = document.getElementById('selected-author-title');
            const count = document.getElementById('selected-author-count');

            title.textContent = authorName;
            grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-dim);">Loading comics...</div>';
            section.style.display = 'block';
            section.scrollIntoView({ behavior: 'smooth' });

            try {
                const comics = await api.getComicsByAuthor(authorName);
                count.textContent = `${comics.length} comics`;

                if (comics.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">No comics found for this author.</div>';
                    return;
                }

                grid.innerHTML = comics.map(comic => {
                    const coverUrl = api.getCoverUrl(comic.cover_filename);
                    const genresHtml = (comic.genres || []).slice(0, 3).map(g => `<span class="tag-chip">${g}</span>`).join('');
                    const titleSafe = (comic.title || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

                    return `
                        <div class="comic-card" onclick="window.location.href='detail.html?id=${comic.id}'" style="cursor: pointer;">
                            <div class="card-thumb-wrapper">
                                ${comic.gallery_id ? `<span class="card-id-badge">${comic.gallery_id}</span>` : ''}
                                <button type="button" class="btn-card-delete" onclick="handleDeleteComicCard(event, ${comic.id}, '${titleSafe}')" title="Delete this comic">
                                    Delete
                                </button>
                                <img src="${coverUrl}" alt="${titleSafe}" class="card-thumb" referrerpolicy="no-referrer" onerror="this.src='assets/rem.jpg'">
                            </div>
                            <div class="card-body">
                                <div class="card-title" title="${titleSafe}">${comic.title}</div>
                                <div class="card-author">${comic.author || 'Unknown Author'}</div>
                                <div class="card-tags">${genresHtml}</div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--danger);">Error: ${err.message}</div>`;
            }
        }

        /**
         * Quick delete comic card
         */
        function handleDeleteComicCard(event, comicId, title) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            showConfirmModal({
                title: 'Confirm Delete Comic',
                message: `Are you sure you want to permanently delete <strong>"${title}"</strong>?<br><br><span style="color: var(--danger); font-size: 13px;">This action will delete all chapters and associated cover images, and cannot be undone!</span>`,
                confirmText: 'Delete Permanently',
                cancelText: 'Cancel',
                type: 'danger',
                onConfirm: async () => {
                    await api.deleteComic(comicId);
                    showToast(`Comic "${title}" deleted successfully!`, 'success');
                    loadAuthors();
                    if (selectedAuthorName) {
                        selectAuthor(selectedAuthorName);
                    }
                }
            });
        }

        function openRenameModal(name) {
            document.getElementById('rename-author-old').value = name;
            document.getElementById('rename-author-display').value = name;
            document.getElementById('rename-author-new').value = name;
            document.getElementById('modal-rename-author').classList.add('active');
        }

        function closeRenameModal() {
            document.getElementById('modal-rename-author').classList.remove('active');
        }

        document.getElementById('form-rename-author').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldName = document.getElementById('rename-author-old').value.trim();
            const newName = document.getElementById('rename-author-new').value.trim();
            if (!newName || newName === oldName) {
                closeRenameModal();
                return;
            }

            try {
                const res = await api.renameAuthor(oldName, newName);
                showToast(`Renamed author for ${res.updated_count} comics!`, 'success');
                closeRenameModal();
                loadAuthors();
                if (selectedAuthorName === oldName) {
                    selectAuthor(newName);
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        loadAuthors();
    </script>
</body>
</html>
