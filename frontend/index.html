<!--
  HManga Library — Trang Chủ Thư Viện Truyện (index.html)
  ======================================================
  Nhiệm vụ:
  1. Hiển thị danh sách tất cả các bộ truyện đã lưu trong thư viện dưới dạng lưới thẻ (Grid Cards).
  2. Thanh tìm kiếm nhanh thời gian thực (Live Search với Debounce 300ms chống spam request).
  3. Thanh điều hướng (Navbar) với logo thương hiệu, ô tìm kiếm trung tâm và liên kết trang (Thể loại, Tác giả, Thêm truyện).
  4. Hiển thị ảnh bìa tải từ server (/api/covers/{filename}) kèm ảnh dự phòng (rem.jpg) nếu lỗi.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HManga Library — Personal Manga Library</title>
    <!-- Favicon website -->
    <link rel="icon" type="image/jpeg" href="assets/rem.jpg">
    <!-- File stylesheet dùng chung -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <!-- Brand logo & app title -->
            <a href="index.html" class="nav-brand">
                <img src="assets/rem.jpg" alt="HManga Logo" class="nav-logo">
                <span class="nav-brand-text">HManga</span>
            </a>

            <!-- Search bar & Advanced Search Button -->
            <div class="nav-center">
                <form class="quick-search-form" id="quickSearchForm" action="search.html" method="GET" autocomplete="off" onsubmit="event.preventDefault();">
                    <div class="quick-search-wrapper">
                        <input type="search" name="s" id="inputQuickSearch" class="quick-search-input" placeholder="Search comics..." autocomplete="off">
                    </div>
                    <a href="search.html" id="btnGoAdvanced" class="btn-go-advanced" title="Advanced Search">
                        <span>Advanced Search</span>
                    </a>
                </form>
            </div>

            <!-- Right navigation actions -->
            <div class="nav-links">
                <a href="genres.html" class="nav-link">Genres</a>
                <a href="authors.html" class="nav-link">Authors</a>
                <a href="add.html" class="btn-add">
                    <span>Add Comic</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- 2. Main Content Area -->
    <main class="main-content">
        <!-- Page Title & Count -->
        <div class="page-header" style="text-align: center;">
            <h1 class="page-title" style="justify-content: center;">Comic Library</h1>
            <p class="page-subtitle" id="comic-count">Loading library...</p>
        </div>

        <!-- Comic Cards Grid -->
        <div id="comic-grid" class="comic-grid">
            <div style="grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--text-dim);">
                Loading comic library...
            </div>
        </div>
    </main>

    <!-- Load JavaScript utilities -->
    <script src="app.js"></script>
    <script>
        let searchQuery = '';
        let debounceTimer;

        /**
         * Load comics from backend API and render grid
         */
        async function loadComics() {
            const grid = document.getElementById('comic-grid');
            const countEl = document.getElementById('comic-count');
            
            try {
                const comics = await api.getComics({ q: searchQuery });
                countEl.textContent = `${comics.length} comics in library`;

                if (comics.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 80px 20px;">
                            <p style="font-size: 18px; color: var(--text-muted); margin-bottom: 8px;">No comics found in library</p>
                            <p style="font-size: 14px; color: var(--text-dim); margin-bottom: 20px;">Start by adding a new comic</p>
                            <a href="add.html" class="btn btn-primary">Add Comic Now</a>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = comics.map(comic => {
                    const coverUrl = api.getCoverUrl(comic.cover_filename);
                    const genresHtml = (comic.genres || []).slice(0, 3).map(g => 
                        `<span class="tag-chip">${g}</span>`
                    ).join('') + ((comic.genres && comic.genres.length > 3) ? `<span class="tag-chip">+${comic.genres.length - 3}</span>` : '');

                    const titleSafe = (comic.title || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

                    return `
                        <div class="comic-card" onclick="window.location.href='detail.html?id=${comic.id}'" style="cursor: pointer;">
                            <div class="card-thumb-wrapper">
                                ${comic.gallery_id ? `<span class="card-id-badge">${comic.gallery_id}</span>` : ''}
                                <button type="button" class="btn-card-delete" onclick="handleDeleteComicCard(event, ${comic.id}, '${titleSafe}')" title="Delete this comic">
                                    Delete
                                </button>
                                <img src="${coverUrl}" alt="${titleSafe}" class="card-thumb" referrerpolicy="no-referrer" onerror="this.src='assets/rem.jpg'">
                            </div>
                            <div class="card-body">
                                <div class="card-title" title="${titleSafe}">${comic.title}</div>
                                <div class="card-author">${comic.author || 'Unknown Author'}</div>
                                <div class="card-tags">${genresHtml}</div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--danger);">
                        Cannot connect to backend server. Please ensure backend is running on port 8000!
                    </div>
                `;
            }
        }

        /**
         * Quick delete comic card directly from homepage
         */
        function handleDeleteComicCard(event, comicId, title) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            showConfirmModal({
                title: 'Confirm Delete Comic',
                message: `Are you sure you want to permanently delete <strong>"${title}"</strong>?<br><br><span style="color: var(--danger); font-size: 13px;">This action will delete all chapters and associated cover images, and cannot be undone!</span>`,
                confirmText: 'Delete Permanently',
                cancelText: 'Cancel',
                type: 'danger',
                onConfirm: async () => {
                    await api.deleteComic(comicId);
                    showToast(`Comic "${title}" deleted successfully!`, 'success');
                    loadComics();
                }
            });
        }

        // Đọc từ khóa tìm kiếm ban đầu từ URL Query (nếu người dùng chuyển từ trang khác sang)
        const urlParams = new URLSearchParams(window.location.search);
        const initialQuery = urlParams.get('q') || urlParams.get('s');
        const searchInput = document.getElementById('inputQuickSearch');

        if (initialQuery && searchInput) {
            searchQuery = initialQuery;
            searchInput.value = initialQuery;
        }

        // Lắng nghe sự kiện gõ phím trên ô tìm kiếm nhanh (kèm Debounce 300ms)
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    searchQuery = e.target.value.trim();
                    loadComics();
                }, 300);
            });
        }

        // Tải danh sách truyện khi trang được mở
        loadComics();
    </script>
</body>
</html>
