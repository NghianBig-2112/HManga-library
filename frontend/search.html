<!--
  HManga Library — Trang Tìm Kiếm & Lọc Nâng Cao (search.html)
  ===========================================================
  Nhiệm vụ:
  1. Cung cấp form tìm kiếm kết hợp nhiều tiêu chí:
     - Tên bộ truyện (tìm kiếm mờ ilike).
     - Tác giả (gợi ý tự động hoặc nhập tay).
     - Thể loại (dropdown chọn thể loại kèm số lượng truyện).
  2. Hiển thị kết quả tìm kiếm theo dạng lưới thẻ truyện (Grid Cards).
  3. Cho phép người dùng đặt lại bộ lọc tìm kiếm (Reset filter) về mặc định.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search — HManga Library</title>
    <!-- Favicon website -->
    <link rel="icon" type="image/jpeg" href="assets/rem.jpg">
    <!-- File stylesheet dùng chung -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="assets/rem.jpg" alt="HManga Logo" class="nav-logo">
                <span class="nav-brand-text">HManga</span>
            </a>

            <!-- Search form in Navbar -->
            <div class="nav-center">
                <form class="quick-search-form" id="quickSearchForm" action="index.html" method="GET" autocomplete="off">
                    <div class="quick-search-wrapper">
                        <input type="search" name="s" id="inputQuickSearch" class="quick-search-input" placeholder="Search comics..." autocomplete="off">
                    </div>
                    <a href="search.html" id="btnGoAdvanced" class="btn-go-advanced always-visible" title="Advanced Search">
                        <span>Advanced Search</span>
                    </a>
                </form>
            </div>

            <!-- Navigation Links -->
            <div class="nav-links">
                <a href="genres.html" class="nav-link">Genres</a>
                <a href="authors.html" class="nav-link">Authors</a>
                <a href="add.html" class="btn-add">
                    <span>Add Comic</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- 2. Main Content Area -->
    <main class="main-content">
        <!-- Search Page Title -->
        <div class="page-header">
            <h1 class="page-title">Search & Filter Comics</h1>
            <p class="page-subtitle">Search comics by title, author, and genre</p>
        </div>

        <!-- Advanced Search Form -->
        <div class="card" style="margin-bottom: 24px;">
            <form id="search-form">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Comic title:</label>
                        <input type="text" id="search-q" class="form-control" placeholder="Enter comic title keyword...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Author:</label>
                        <input type="text" id="search-author" list="search-authors-datalist" class="form-control" placeholder="Enter or select author name...">
                        <datalist id="search-authors-datalist"></datalist>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Genre:</label>
                    <select id="search-genre" class="form-control">
                        <option value="">-- All Genres --</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">Search</button>
                    <button type="button" id="btn-reset-search" class="btn btn-secondary">Reset Filter</button>
                </div>
            </form>
        </div>

        <!-- Search Results Header -->
        <div id="results-header" style="margin-bottom: 16px; font-size: 15px; font-weight: 600; color: var(--text-muted); display: none;">
            Search Results (<span id="results-count" style="color: var(--primary);">0</span>)
        </div>

        <!-- Results Grid -->
        <div id="results-grid" class="comic-grid"></div>
    </main>

    <!-- Load JavaScript utilities -->
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const genres = await api.getGenres();
                const genreSelect = document.getElementById('search-genre');
                genres.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g.name;
                    opt.textContent = `${g.name} (${g.comic_count} comics)`;
                    genreSelect.appendChild(opt);
                });
            } catch (err) {
                console.warn('Error loading search genres:', err);
            }

            try {
                const authors = await api.getAuthors();
                const datalist = document.getElementById('search-authors-datalist');
                datalist.innerHTML = authors.map(a => `<option value="${a.name}">`).join('');
            } catch (err) {
                console.warn('Error loading search authors:', err);
            }

            const urlParams = new URLSearchParams(window.location.search);
            const qParam = urlParams.get('q') || urlParams.get('s');
            const authorParam = urlParams.get('author');
            const genreParam = urlParams.get('genre');

            if (qParam) document.getElementById('search-q').value = qParam;
            if (authorParam) document.getElementById('search-author').value = authorParam;
            if (genreParam) document.getElementById('search-genre').value = genreParam;

            doSearch();
        });

        /**
         * Perform search with filters and render results
         */
        async function doSearch() {
            const q = document.getElementById('search-q').value.trim();
            const author = document.getElementById('search-author').value.trim();
            const genre = document.getElementById('search-genre').value.trim();

            const grid = document.getElementById('results-grid');
            const resHeader = document.getElementById('results-header');
            const countEl = document.getElementById('results-count');

            grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-dim);">Searching...</div>';

            try {
                const results = await api.searchComics({ q, author, genre });
                resHeader.style.display = 'block';
                countEl.textContent = results.length;

                if (results.length === 0) {
                    grid.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted);">
                            <p style="font-size: 16px; margin-bottom: 6px;">No comics found matching your criteria</p>
                            <p style="font-size: 13px; color: var(--text-dim);">Try broadening your search criteria</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = results.map(comic => {
                    const coverUrl = api.getCoverUrl(comic.cover_filename);
                    const genresHtml = (comic.genres || []).slice(0, 3).map(g => 
                        `<span class="tag-chip">${g}</span>`
                    ).join('');
                    const titleSafe = (comic.title || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

                    return `
                        <div class="comic-card" onclick="window.location.href='detail.html?id=${comic.id}'" style="cursor: pointer;">
                            <div class="card-thumb-wrapper">
                                ${comic.gallery_id ? `<span class="card-id-badge">${comic.gallery_id}</span>` : ''}
                                <button type="button" class="btn-card-delete" onclick="handleDeleteComicCard(event, ${comic.id}, '${titleSafe}')" title="Delete this comic">
                                    Delete
                                </button>
                                <img src="${coverUrl}" alt="${titleSafe}" class="card-thumb" referrerpolicy="no-referrer" onerror="this.src='assets/rem.jpg'">
                            </div>
                            <div class="card-body">
                                <div class="card-title" title="${titleSafe}">${comic.title}</div>
                                <div class="card-author">${comic.author || 'Unknown Author'}</div>
                                <div class="card-tags">${genresHtml}</div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--danger);">
                        Search error: ${err.message}
                    </div>
                `;
            }
        }

        /**
         * Quick delete comic card from search results
         */
        function handleDeleteComicCard(event, comicId, title) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            showConfirmModal({
                title: 'Confirm Delete Comic',
                message: `Are you sure you want to permanently delete <strong>"${title}"</strong>?<br><br><span style="color: var(--danger); font-size: 13px;">This action will delete all chapters and associated cover images, and cannot be undone!</span>`,
                confirmText: 'Delete Permanently',
                cancelText: 'Cancel',
                type: 'danger',
                onConfirm: async () => {
                    await api.deleteComic(comicId);
                    showToast(`Comic "${title}" deleted successfully!`, 'success');
                    doSearch();
                }
            });
        }

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            doSearch();
        });

        document.getElementById('btn-reset-search').addEventListener('click', () => {
            document.getElementById('search-form').reset();
            doSearch();
        });
    </script>
</body>
</html>
